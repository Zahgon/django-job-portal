version: '3'

services:
  web:
    restart: always
    build: .
    environment:
      DATABASE_URL: sqlite:////app/db.sqlite3
    command: ./entrypoint.sh
    volumes:
      - .:/app
      - ./db.sqlite3:/db.sqlite3
      - static_volume:/usr/src/app/jobs/staticfiles
    ports:
      - "8000:8000"

volumes:
  static_volume:
